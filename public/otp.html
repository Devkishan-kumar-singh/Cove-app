<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>Verify your email — Cove</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="auth-page otp-page"><div class="auth-orb orb-a"></div><div class="auth-orb orb-b"></div><a class="brand auth-brand" href="index.html"><span class="brand-mark"><span></span><span></span><span></span></span>Cove</a>
<main class="otp-card"><div class="mail-icon">✉<span>✓</span></div><span class="step">ONE QUICK CHECK</span><h2>Verify your email</h2><p>Enter the 6-digit code we sent to<br><strong id="emailDisplay">your email</strong></p><div class="otp-inputs" id="otpInputs"><input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6"></div><div class="status-msg" id="statusMsg" role="status"></div><button type="button" id="verifyBtn"><span class="btn-text">Verify and continue</span><span class="btn-spinner" hidden></span><i>→</i></button><p class="resend">Didn’t receive it? <a href="#" id="resend">Send a new code</a> <span id="resendTimer"></span></p><p class="back-link"><a href="register.html" id="backLink">← Use a different email</a></p><div class="secure-strip"><span>⌑</span><p><b>Secure verification</b><small>This code expires in 5 minutes</small></p></div></main><script src="otp-script.js" defer></script></body></html>
